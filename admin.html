<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Barista & Kasir | Titik Temu Coffeehouse</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Dynamic Navbar -->
  <nav id="main-nav"></nav>

  <main class="container" style="padding-top: 30px; padding-bottom: 60px;">
    <div id="admin-content">
      <!-- Injected dynamically by js/admin.js -->
    </div>
  </main>

  <!-- MODAL TAMBAH / EDIT MENU KOPI -->
  <div id="admin-menu-modal" class="modal-backdrop">
    <div class="modal-box" style="max-width: 580px;">
      <div class="modal-header">
        <h3 class="modal-title">Formulir Menu Kopi / Kudapan</h3>
        <button onclick="closeAdminMenuModal()" class="modal-close-btn">&times;</button>
      </div>
      <div id="admin-menu-modal-content" class="modal-body">
        <!-- Injected via js/admin.js -->
      </div>
    </div>
  </div>

  <!-- Standard Footer -->
  <footer id="main-footer"></footer>

  <!-- Scripts -->
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
