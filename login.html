<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk & Daftar Member | Titik Temu Coffeehouse</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Dynamic Navbar -->
  <nav id="main-nav"></nav>

  <main class="container" style="padding: 40px 20px 60px; display: flex; justify-content: center;">
    <div style="background-color: #ffffff; border: 1px solid var(--coffee-border); border-radius: var(--radius-xl); padding: 36px 30px; max-width: 480px; width: 100%; box-shadow: var(--shadow-md);">
      
      <!-- LOGO & HEADING -->
      <div style="text-align: center; margin-bottom: 24px;">
        <div style="width: 54px; height: 54px; background-color: var(--coffee-dark); color: var(--coffee-amber); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; font-size: 26px; margin: 0 auto 12px;">
          ☕
        </div>
        <h2 style="font-size: 22px; font-weight: 900; color: var(--coffee-dark); margin-bottom: 4px;">Akun Titik Temu Coffeehouse</h2>
        <p style="font-size: 13px; color: var(--text-muted);">
          Akses riwayat cangkir kopi, durasi keanggotaan, atau dashboard barista.
        </p>
      </div>

      <!-- 1-CLICK DEMO BUTTONS -->
      <div style="background-color: var(--coffee-foam); border: 1px solid var(--coffee-border); border-radius: var(--radius-lg); padding: 16px; margin-bottom: 24px;">
        <div style="font-size: 11px; font-weight: 800; color: var(--coffee-dark); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; text-align: center;">
          ⚡ Tombol Cepat Masuk Akun Demo (1-Klik)
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <button type="button" onclick="loginDemo('admin')" class="btn btn-dark btn-sm" style="width: 100%; justify-content: flex-start; padding: 10px 14px;">
            <span style="font-size: 16px;">☕</span>
            <div style="text-align: left; flex: 1;">
              <strong>Barista & Kasir (Admin)</strong>
              <div style="font-size: 10px; opacity: 0.8;">User: admin • Sandi: kopiadmin</div>
            </div>
            <span style="font-size: 11px;">Masuk &rarr;</span>
          </button>

          <button type="button" onclick="loginDemo('pelanggan')" class="btn btn-outline btn-sm" style="width: 100%; justify-content: flex-start; padding: 10px 14px; background-color: #ffffff;">
            <span style="font-size: 16px;">👤</span>
            <div style="text-align: left; flex: 1;">
              <strong>Pelanggan Setia (Member)</strong>
              <div style="font-size: 10px; color: var(--text-muted);">User: pelanggan • Sandi: kopienak</div>
            </div>
            <span style="font-size: 11px;">Masuk &rarr;</span>
          </button>
        </div>
      </div>

      <!-- TABS: MASUK / DAFTAR -->
      <div style="display: flex; border-bottom: 2px solid var(--coffee-border); margin-bottom: 20px;">
        <button type="button" id="tab-btn-login" onclick="switchAuthTab('login')" style="flex: 1; padding: 10px; background: none; border: none; font-size: 14px; font-weight: 800; color: var(--coffee-amber); border-bottom: 2px solid var(--coffee-amber); margin-bottom: -2px; cursor: pointer;">
          Masuk Akun
        </button>
        <button type="button" id="tab-btn-register" onclick="switchAuthTab('register')" style="flex: 1; padding: 10px; background: none; border: none; font-size: 14px; font-weight: 700; color: var(--text-muted); cursor: pointer;">
          Daftar Member Baru
        </button>
      </div>

      <!-- ALERT MESSAGE -->
      <div id="auth-alert" style="display: none; padding: 10px 14px; border-radius: var(--radius-md); font-size: 12px; margin-bottom: 16px; font-weight: 600;"></div>

      <!-- FORM 1: LOGIN -->
      <form id="login-form" onsubmit="handleLoginForm(event)">
        <div class="form-group">
          <label class="form-label">Username atau Email:</label>
          <input type="text" id="login-identifier" class="form-input" required placeholder="Contoh: admin atau pelanggan@titiktemu.cafe">
        </div>

        <div class="form-group">
          <label class="form-label">Kata Sandi:</label>
          <input type="password" id="login-password" class="form-input" required placeholder="••••••••">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">
          Masuk ke Akun Saya &rarr;
        </button>
      </form>

      <!-- FORM 2: REGISTER -->
      <form id="register-form" onsubmit="handleRegisterForm(event)" style="display: none;">
        <div class="form-group">
          <label class="form-label">Nama Lengkap:</label>
          <input type="text" id="reg-name" class="form-input" required placeholder="Contoh: Rian Pratama">
        </div>

        <div class="form-group">
          <label class="form-label">Username Unik:</label>
          <input type="text" id="reg-username" class="form-input" required placeholder="Contoh: riankopi">
        </div>

        <div class="form-group">
          <label class="form-label">Alamat Email:</label>
          <input type="email" id="reg-email" class="form-input" required placeholder="Contoh: rian@gmail.com">
        </div>

        <div class="form-group">
          <label class="form-label">Kata Sandi:</label>
          <input type="password" id="reg-password" class="form-input" required placeholder="Minimal 6 karakter">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">
          Daftar Member Kafe Sekarang &rarr;
        </button>
      </form>

    </div>
  </main>

  <!-- Standard Footer -->
  <footer id="main-footer"></footer>

  <!-- Scripts -->
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
  <script>
    function switchAuthTab(tab) {
      const loginForm = document.getElementById("login-form");
      const regForm = document.getElementById("register-form");
      const btnLogin = document.getElementById("tab-btn-login");
      const btnReg = document.getElementById("tab-btn-register");
      const alertBox = document.getElementById("auth-alert");
      if (alertBox) alertBox.style.display = "none";

      if (tab === "login") {
        loginForm.style.display = "block";
        regForm.style.display = "none";
        btnLogin.style.color = "var(--coffee-amber)";
        btnLogin.style.borderBottom = "2px solid var(--coffee-amber)";
        btnReg.style.color = "var(--text-muted)";
        btnReg.style.borderBottom = "none";
      } else {
        loginForm.style.display = "none";
        regForm.style.display = "block";
        btnReg.style.color = "var(--coffee-amber)";
        btnReg.style.borderBottom = "2px solid var(--coffee-amber)";
        btnLogin.style.color = "var(--text-muted)";
        btnLogin.style.borderBottom = "none";
      }
    }

    function showAlert(message, isError = true) {
      const alertBox = document.getElementById("auth-alert");
      if (!alertBox) return;
      alertBox.style.display = "block";
      alertBox.style.backgroundColor = isError ? "#fee2e2" : "#d1fae5";
      alertBox.style.color = isError ? "#991b1b" : "#065f46";
      alertBox.style.border = isError ? "1px solid #f87171" : "1px solid #34d399";
      alertBox.textContent = message;
    }

    function handleLoginForm(e) {
      e.preventDefault();
      const identifier = document.getElementById("login-identifier").value.trim();
      const pass = document.getElementById("login-password").value;

      const res = Store.login(identifier, pass);
      if (res.success) {
        showAlert(res.message + " Mengarahkan...", false);
        setTimeout(() => {
          if (res.user.role === "ADMIN") {
            window.location.href = "admin.html";
          } else {
            window.location.href = "profile.html";
          }
        }, 500);
      } else {
        showAlert(res.message, true);
      }
    }

    function handleRegisterForm(e) {
      e.preventDefault();
      const name = document.getElementById("reg-name").value.trim();
      const username = document.getElementById("reg-username").value.trim();
      const email = document.getElementById("reg-email").value.trim();
      const pass = document.getElementById("reg-password").value;

      const res = Store.register(name, username, email, pass);
      if (res.success) {
        showAlert(res.message + " Mengarahkan ke profil...", false);
        setTimeout(() => {
          window.location.href = "profile.html";
        }, 600);
      } else {
        showAlert(res.message, true);
      }
    }

    function loginDemo(type) {
      if (type === "admin") {
        const res = Store.login("admin", "kopiadmin");
        if (res.success) {
          window.location.href = "admin.html";
        }
      } else {
        const res = Store.login("pelanggan", "kopienak");
        if (res.success) {
          window.location.href = "profile.html";
        }
      }
    }
  </script>
</body>
</html>
